<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>请输入密码</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #dcdad4; --accent: #2f5d50; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --card: #222; --ink: #eee; --muted: #aaa; --line: #3a3a3a; --accent: #7fb8a4; --bad: #f28b82; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  form { width: min(320px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  button { width: 100%; margin-top: 12px; font-size: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
  p { min-height: 1.4em; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  p.bad { color: var(--bad); }
  /* 本机存过密码：不画密码框，直接解密（否则每次打开都会闪一下密码框）；超过一秒还没打开，再淡出一行字 */
  html.auto #f { display: none; }
  html.auto body::after { content: "正在打开…"; font-size: 14px; color: var(--muted); opacity: 0; animation: show .3s 1s forwards; }
  @keyframes show { to { opacity: 1; } }
</style>
<script>try { if (localStorage.getItem("pw")) document.documentElement.className = "auto"; } catch (e) {}</script>
</head>
<body>
<form id="f" onsubmit="return false">
  <h1>请输入密码</h1>
  <input id="pw" type="password" placeholder="请输入密码" autocomplete="current-password">
  <button id="go" type="button" disabled>加载中…</button>
  <p id="msg">网慢的话要等一会儿</p>
</form>
